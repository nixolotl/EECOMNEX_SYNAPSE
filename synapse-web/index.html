<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse Deck Maker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Synapse Deck Maker</h1>
    <p class="tagline">Paste your notes. Get a deck for your Synapse.</p>

    <h2>Step 1: Your notes</h2>
    <label for="deckName">Deck name</label>
    <input id="deckName" type="text" placeholder="e.g. Electronics">

    <label for="notes">Your notes</label>
    <textarea id="notes" rows="8" placeholder="Paste your reviewer or notes here..."></textarea>

    <button id="generateBtn">Generate deck automatically</button>
    <p id="genMsg" class="msg"></p>

    <h2>Or: use any AI chat yourself</h2>
    <p class="tagline">Copy the prompt, paste it into an AI chat, then paste its answer below.</p>
    <button id="copyPromptBtn">Copy prompt for AI</button>
    <p id="copyMsg" class="msg"></p>

    <textarea id="aiReply" rows="6" placeholder="Paste the JSON the AI gives you..."></textarea>
    <button id="loadDeckBtn">Load deck</button>
    <p id="loadMsg" class="msg"></p>

    <section id="preview"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
